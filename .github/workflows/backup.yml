name: Respaldo cifrado de ita

on:
  workflow_dispatch:
  schedule:
    # 03:23 America/Bogota. GitHub puede retrasar u omitir ejecuciones.
    - cron: '23 8 * * *'

permissions:
  contents: read
  actions: write # Inventario/rotación de artefactos; no escritura de código.

concurrency:
  group: ita-database-backup
  cancel-in-progress: false

jobs:
  backup:
    # Activación explícita tras medir cuotas, custodiar clave y probar recuperación (docs/backup.md).
    if: vars.ITA_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ITA_PG_BIN: /usr/lib/postgresql/17/bin
      ITA_BASH_BIN: /bin/bash
    steps:
      # Los artefactos de un repositorio público los puede descargar cualquiera. Aunque estén
      # cifrados, contienen hashes de contraseñas Auth: el job se niega a ejecutarse si el
      # repositorio no es privado. Funciona igual para schedule y workflow_dispatch.
      - name: Exigir repositorio privado
        id: private
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          visibility="$(gh api "repos/$REPOSITORY" --jq '.private')"
          if [ "$visibility" != "true" ]; then
            echo "::error::REPOSITORY_NOT_PRIVATE: el respaldo solo se sube como artefacto en un repositorio privado."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0
      - name: Instalar herramientas PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' 'Suites: noble-pgdg' 'Architectures: amd64' 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/ita-pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-17
          "$ITA_PG_BIN/pg_dump" --version
      # TLS verify-full: certificado CA de Supabase (Dashboard → Database → SSL Configuration).
      - name: Preparar CA de PostgreSQL
        id: tls
        env:
          ITA_PG_CA_CERT: ${{ secrets.ITA_PG_CA_CERT }}
        run: |
          if [ -z "$ITA_PG_CA_CERT" ]; then
            echo "::error::TLS_CA_REQUIRED: configurar el secreto ITA_PG_CA_CERT."
            exit 1
          fi
          ca="$RUNNER_TEMP/ita-postgres-ca.crt"
          printf '%s\n' "$ITA_PG_CA_CERT" > "$ca"
          chmod 600 "$ca"
          echo "ITA_PG_SSLROOTCERT=$ca" >> "$GITHUB_ENV"
      - name: Marcar ejecución iniciada
        run: node scripts/backup.mjs status running
        env:
          ITA_BACKUP_DATABASE_URL: ${{ secrets.ITA_BACKUP_DATABASE_URL }}
      - name: Exportar, comprimir, cifrar y validar cuota
        id: backup
        run: node scripts/backup.mjs create
        env:
          ITA_BACKUP_DATABASE_URL: ${{ secrets.ITA_BACKUP_DATABASE_URL }}
          ITA_BACKUP_RECOVERY_KEY: ${{ secrets.ITA_BACKUP_RECOVERY_KEY }}
          ITA_BACKUP_BUDGET_BYTES: ${{ vars.ITA_BACKUP_BUDGET_BYTES }}
          ITA_OTHER_ACTIONS_STORAGE_BYTES: ${{ vars.ITA_OTHER_ACTIONS_STORAGE_BYTES }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Subir únicamente copia cifrada
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.backup.outputs.name }}
          path: ${{ steps.backup.outputs.path }}
          if-no-files-found: error
          # Corta a propósito: la custodia duradera es la copia externa (USB), no Actions.
          retention-days: 7
          compression-level: 0
      - name: Confirmar copia almacenada
        run: node scripts/backup.mjs status success
        env:
          ITA_BACKUP_DATABASE_URL: ${{ secrets.ITA_BACKUP_DATABASE_URL }}
          ITA_BACKUP_ARTIFACT_NAME: ${{ steps.backup.outputs.name }}
          ITA_BACKUP_BYTES: ${{ steps.backup.outputs.bytes }}
      - name: Registrar fallo sin datos sensibles
        # Solo cuando la base ya es alcanzable con TLS verificado; nunca desde un repositorio público.
        if: failure() && steps.private.outcome == 'success' && steps.tls.outcome == 'success'
        run: node scripts/backup.mjs status failed
        env:
          ITA_BACKUP_DATABASE_URL: ${{ secrets.ITA_BACKUP_DATABASE_URL }}
