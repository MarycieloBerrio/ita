name: Verificar ita

# Ramas de trabajo se verifican mediante su pull request; push solo en main evita ejecuciones dobles.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ita-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Sin secretos del salón. La base y las identidades existen solo durante este trabajo.
    env:
      CI: 'true'
      VITE_SUPABASE_URL: https://mrnzvgivfjivuobpgens.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
      VITE_APP_ENV: pilot
      PLAYWRIGHT_CHANNEL: chromium
      PGPASSWORD: ita_ci_fictional_only
      ITA_TEST_DATABASE_URL: postgresql://ita_test:ita_ci_fictional_only@127.0.0.1:55433/postgres
      ITA_PG_BIN: /usr/lib/postgresql/17/bin
      ITA_BASH_BIN: /bin/bash
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: ita_test
          POSTGRES_PASSWORD: ita_ci_fictional_only
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:55433:5432
        options: >-
          --health-cmd "pg_isready -U ita_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Instalar versiones bloqueadas
        run: npm ci
      - name: Vulnerabilidades conocidas en dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - name: Instalar herramientas PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' 'Suites: noble-pgdg' 'Architectures: amd64' 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/ita-pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-17
          "$ITA_PG_BIN/pg_dump" --version
      - name: Formato, tipos y lint
        run: |
          npm run format:check
          npm run typecheck
          npm run lint
      - name: Reglas de negocio y componentes
        run: npm test
      - name: Migraciones, autorización e integridad en PGlite
        run: npm run test:db
      - name: Funciones públicas no ejecutables por anon
        run: npm run test:grants
      - name: Concurrencia con conexiones PostgreSQL independientes
        run: npm run test:db:native
      - name: Crear copia con backup.mjs y restaurarla en otra base local
        run: npm run test:restore
      - name: Ejecutar volcado CLI con varios esquemas y herramientas nativas
        run: node tests/backup-native-pipeline.mjs
      - name: Instalar Chromium de la versión bloqueada de Playwright
        run: npx --no-install playwright install --with-deps chromium
      - name: Recorridos de navegador con SQL real y Auth ficticio
        run: npm run test:e2e
      - name: Construir archivos de publicación
        run: npm run build
      # No publica archivos ni conserva cachés/artefactos: no comparte la cuota de respaldos.
